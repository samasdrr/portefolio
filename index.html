<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samantha Asdrubal - Portfolio Business Analyst</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: radial-gradient(ellipse at center, #1a1a3e 0%, #05050f 100%);
            display: flex; align-items: center; justify-content: center;
            height: 100vh;
        }

        /* ── MONITOR ── */
        .monitor-wrapper { display: flex; flex-direction: column; align-items: center; }

        .monitor-body {
            position: relative;
            background: linear-gradient(160deg, #E2DFD7 0%, #CACAC0 40%, #B8B5AD 80%, #C6C3BB 100%);
            border-radius: 18px 18px 10px 10px;
            padding: 16px 16px 46px 16px;
            box-shadow:
                inset 2px 2px 0 rgba(255,255,255,0.55),
                inset -1px -1px 0 rgba(0,0,0,0.25),
                0 22px 60px rgba(0,0,0,0.75),
                0 0 0 1px #9999;
            width: min(90vw, 1040px);
        }

        .screen-bezel {
            background: #111;
            border-radius: 6px 6px 4px 4px;
            padding: 6px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9), inset 0 2px 6px rgba(0,0,0,0.8);
        }

        .screen-inner {
            width: 100%;
            aspect-ratio: 4 / 3;
            max-height: 64vh;
            overflow: hidden;
            border-radius: 3px;
            position: relative;
        }

        /* ── XP DESKTOP ── */
        .xp-desktop {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom,
                #4B90D6 0%, #6AAEE2 18%, #8EC4EC 33%, #B2DAF7 42%,
                #8CC28C 48%, #6AAD6A 56%, #4A9A4A 66%, #3A8838 76%, #2A7020 100%);
            font-family: 'Tahoma', Arial, sans-serif;
            font-size: 12px;
            overflow: hidden;
        }

        /* Clouds */
        .cloud { position: absolute; border-radius: 50px; background: rgba(255,255,255,0.82); filter: blur(7px); }

        /* ── DESKTOP ICONS ── */
        .icons-col { position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 6px; }

        .d-icon {
            display: flex; flex-direction: column; align-items: center;
            width: 64px; padding: 4px 3px 3px; border-radius: 3px;
            cursor: pointer; user-select: none; border: 1px solid transparent;
        }
        .d-icon:hover  { background: rgba(49,106,197,0.35); border-color: rgba(49,106,197,0.6); }
        .d-icon.active { background: rgba(49,106,197,0.55); border-color: rgba(255,255,255,0.6); outline: 1px dotted rgba(255,255,255,0.7); }
        .d-icon svg    { width: 36px; height: 36px; }
        .d-lbl {
            font-size: 10px; color: #fff; text-align: center; margin-top: 2px;
            text-shadow: 1px 1px 2px #000, 0 0 4px #000;
            line-height: 1.2; max-width: 60px; word-break: break-word;
        }

        /* ── XP WINDOW ── */
        .xp-win {
            position: absolute;
            top: 3%; left: 8%; right: 3%; bottom: 11%;
            display: flex; flex-direction: column;
            border-radius: 8px 8px 4px 4px;
            box-shadow: 3px 5px 22px rgba(0,0,0,0.65), 0 0 0 1px rgba(0,0,60,0.3);
            overflow: hidden; z-index: 10;
        }

        .xp-titlebar {
            flex-shrink: 0;
            background: linear-gradient(to bottom, #0A246A 0%, #2E6BC6 50%, #4A8EE0 100%);
            padding: 3px 4px 3px 8px;
            display: flex; align-items: center; justify-content: space-between; gap: 4px;
        }
        .xp-title-text {
            color: #fff; font-size: 11px; font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 5px;
            flex: 1; overflow: hidden; white-space: nowrap;
        }
        .xp-win-btns { display: flex; gap: 2px; flex-shrink: 0; }
        .xp-btn {
            width: 21px; height: 21px; border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; color: #fff;
            text-shadow: 1px 1px rgba(0,0,0,0.5); cursor: pointer;
        }
        .xp-btn-min { background: linear-gradient(to bottom, #52A0E8, #2268C0); }
        .xp-btn-max { background: linear-gradient(to bottom, #52A0E8, #2268C0); }
        .xp-btn-cls { background: linear-gradient(to bottom, #E85A5A, #B82020); }
        .xp-btn-cls:hover { background: linear-gradient(to bottom, #FF7070, #D03030); }

        .xp-menubar {
            flex-shrink: 0; background: #ECE9D8;
            border-bottom: 1px solid #ACA89C; padding: 1px 2px; display: flex;
        }
        .xp-mi { font-size: 11px; padding: 2px 6px; cursor: default; color: #000; border-radius: 2px; }
        .xp-mi:hover { background: #316AC5; color: #fff; }

        .xp-body { flex: 1; background: #fff; overflow-y: auto; overflow-x: hidden; }
        .xp-body::-webkit-scrollbar { width: 16px; }
        .xp-body::-webkit-scrollbar-track { background: #F0EDE5; border-left: 1px solid #ccc; }
        .xp-body::-webkit-scrollbar-thumb { background: linear-gradient(to right,#D8D4CC,#B8B5AD); border: 1px solid #999; }

        /* ── TASKBAR ── */
        .xp-taskbar {
            position: absolute; bottom: 0; left: 0; right: 0; height: 30px;
            background: linear-gradient(to bottom, #2560C4 0%, #1A4AAA 40%, #1A4AAA 80%, #2A5AC4 100%);
            display: flex; align-items: center; padding: 0 4px; gap: 3px; z-index: 20;
            border-top: 1px solid rgba(255,255,255,0.28);
        }
        .start-btn {
            display: flex; align-items: center; gap: 3px;
            padding: 2px 10px 2px 5px; height: 24px;
            background: linear-gradient(to bottom, #59CC2A 0%, #3DA018 50%, #2D8810 100%);
            border-radius: 0 12px 12px 0; border: 1px solid #1A5A08;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 1px 1px 4px rgba(0,0,0,0.4);
            cursor: pointer; color: #fff; font-weight: bold; font-size: 11px;
            font-family: 'Tahoma', Arial, sans-serif;
        }
        .tb-item {
            display: flex; align-items: center; gap: 3px;
            padding: 2px 8px; height: 22px;
            background: linear-gradient(to bottom, #3A70BC, #1E50A0);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 3px;
            color: #fff; font-size: 10px; cursor: pointer;
            max-width: 150px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        }
        .systray {
            margin-left: auto; display: flex; align-items: center; gap: 6px;
            background: rgba(0,20,100,0.28); border: 1px solid rgba(100,150,255,0.28);
            border-radius: 3px; padding: 0 7px; height: 22px; font-size: 10px; color: #fff;
        }
        .lang-btn {
            background: none; border: none; color: #fff; cursor: pointer;
            font-size: 10px; padding: 0; font-family: 'Tahoma', Arial, sans-serif;
        }

        /* ── MONITOR STAND ── */
        .monitor-neck {
            width: 90px; height: 22px;
            background: linear-gradient(to bottom, #B8B5AD, #A0A098);
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            margin: 0 auto;
        }
        .monitor-base {
            width: 210px; height: 16px;
            background: linear-gradient(to bottom, #C8C5BD, #A8A5A0);
            border-radius: 3px 3px 6px 6px; margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.45);
        }
        .monitor-deco {
            position: absolute; bottom: 9px; left: 0; right: 0;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .brand { font-size: 9px; color: #888; letter-spacing: 3px; font-family: Arial; }
        .power-ring {
            width: 13px; height: 13px; border: 2px solid #888; border-radius: 50%; position: relative;
        }
        .power-ring::after {
            content:''; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
            width: 2px; height: 7px; background: #888;
        }
        .led {
            width: 5px; height: 5px; border-radius: 50%;
            background: #00ff88; box-shadow: 0 0 5px #00ff88;
            animation: ledBlink 2s ease-in-out infinite;
        }
        @keyframes ledBlink { 0%,100%{opacity:.7} 50%{opacity:1;box-shadow:0 0 9px #00ff88} }

        /* ── WINDOW CONTENT ── */
        .w-pad { padding: 14px; }
        .w-hero {
            display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
            padding: 12px; background: linear-gradient(to right,#EEF4FF,#F4F8FF);
            border: 1px solid #C0CCE8; border-radius: 4px;
        }
        .w-avatar {
            width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg,#316AC5,#4A8EE0);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: bold; font-size: 16px; border: 3px solid #316AC5;
        }
        .w-section { font-size: 13px; font-weight: bold; color: #003087; border-bottom: 1px solid #316AC5; padding-bottom: 4px; margin-bottom: 12px; display: flex; align-items: center; gap: 5px; }
        .w-para { font-size: 11px; color: #333; line-height: 1.7; margin-bottom: 10px; padding: 10px; background: #FAFAF8; border: 1px solid #E0DDD5; border-radius: 3px; }

        .skill-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
        .skill-cat { background: linear-gradient(135deg,#ECE9D8,#E0DDD0); border: 1px solid #C0BDB5; border-radius: 4px; padding: 10px; }
        .skill-cat-ttl { font-weight: bold; color: #316AC5; font-size: 11px; margin-bottom: 7px; border-bottom: 1px solid #D0CCCC; padding-bottom: 3px; }
        .skill-item { font-size: 11px; color: #333; padding: 2px 0; display: flex; align-items: flex-start; gap: 4px; }
        .skill-arrow { color: #316AC5; flex-shrink: 0; }

        .proj-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(90px,1fr)); gap: 8px; }
        .proj-folder { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; cursor: pointer; border-radius: 3px; text-align: center; border: 1px solid transparent; }
        .proj-folder:hover { background: #EEF2FC; border-color: #316AC5; }
        .proj-folder span { font-size: 10px; color: #333; margin-top: 4px; line-height: 1.2; }

        .proj-detail { margin-bottom: 12px; }
        .proj-back { font-size: 11px; color: #316AC5; background: none; border: none; cursor: pointer; text-decoration: underline; margin-bottom: 10px; padding: 0; display: block; font-family: 'Tahoma', Arial, sans-serif; }
        .proj-card { border: 1px solid #D0CCC4; border-radius: 4px; padding: 12px; background: #F8F8F4; }
        .proj-title { font-weight: bold; color: #003087; font-size: 12px; margin-bottom: 7px; }
        .proj-desc { color: #333; font-size: 11px; line-height: 1.6; margin-bottom: 8px; }
        .tag { display: inline-block; background: #E8E8F8; border: 1px solid #316AC5; border-radius: 2px; padding: 1px 6px; font-size: 10px; color: #316AC5; margin: 2px; }

        .contact-card { background: linear-gradient(to right,#EEF4FF,#F4F8FF); border: 1px solid #C0CCE8; border-radius: 4px; padding: 14px; margin-bottom: 12px; }
        .contact-link { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: #fff; border: 1px solid #C0CCE8; border-radius: 3px; color: #316AC5; text-decoration: none; font-size: 11px; margin-bottom: 6px; }
        .contact-link:hover { background: #EEF2FC; }
        .send-btn { display: inline-block; padding: 6px 16px; background: linear-gradient(to bottom,#316AC5,#1A50A0); color: #fff; border: 1px solid #1A4080; border-radius: 3px; font-size: 11px; text-decoration: none; font-family: 'Tahoma', Arial, sans-serif; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect } = React;

    /* ── SVG ICONS ── */
    const FolderSVG = () => (
        <svg viewBox="0 0 48 40"><rect x="0" y="14" width="48" height="26" rx="3" fill="#E8A400"/><rect x="0" y="10" width="22" height="6" rx="3" fill="#E8A400"/><rect x="0" y="14" width="48" height="24" rx="3" fill="#F5C842"/><rect x="1" y="18" width="46" height="19" rx="2" fill="#FADA6B"/><rect x="0" y="14" width="48" height="5" fill="#E8A400" opacity="0.5"/></svg>
    );
    const PersonSVG = () => (
        <svg viewBox="0 0 40 40"><rect width="40" height="40" rx="4" fill="#316AC5"/><circle cx="20" cy="15" r="7" fill="white"/><path d="M6 38c0-7.7 6.3-14 14-14s14 6.3 14 14" stroke="white" strokeWidth="2" fill="none"/></svg>
    );
    const DocSVG = () => (
        <svg viewBox="0 0 36 44"><rect x="0" y="0" width="29" height="44" rx="2" fill="white" stroke="#999" strokeWidth="1"/><polygon points="29,0 36,8 29,8" fill="#DDD"/><rect x="4" y="12" width="20" height="2" rx="1" fill="#316AC5"/><rect x="4" y="17" width="20" height="1.5" rx="1" fill="#999"/><rect x="4" y="21" width="16" height="1.5" rx="1" fill="#999"/><rect x="4" y="25" width="18" height="1.5" rx="1" fill="#999"/><rect x="4" y="29" width="14" height="1.5" rx="1" fill="#999"/></svg>
    );
    const MailSVG = () => (
        <svg viewBox="0 0 40 32"><rect width="40" height="32" rx="3" fill="#E8F0FF" stroke="#316AC5" strokeWidth="1.5"/><rect x="0" y="0" width="40" height="11" rx="3" fill="#316AC5"/><path d="M2 2 L20 12 L38 2" stroke="white" strokeWidth="1.5" fill="none"/><rect x="4" y="16" width="22" height="2" rx="1" fill="#999"/><rect x="4" y="21" width="16" height="2" rx="1" fill="#999"/></svg>
    );
    const ComputerSVG = () => (
        <svg viewBox="0 0 40 40"><rect x="4" y="2" width="32" height="24" rx="2" fill="#C0D8F0" stroke="#6090C0" strokeWidth="1"/><rect x="6" y="4" width="28" height="20" rx="1" fill="#4A8CD4"/><rect x="14" y="26" width="12" height="4" fill="#A0B8D0"/><rect x="10" y="30" width="20" height="3" rx="1" fill="#A0B8D0"/></svg>
    );
    const RecycleSVG = () => (
        <svg viewBox="0 0 40 44"><path d="M20 2 L26 10 H22 V22 H18 V10 H14 Z" fill="#7098D8"/><path d="M8 18 L2 26 H8 C8 33 13 38 20 38 C27 38 32 33 32 26 H38 L32 18" stroke="#7098D8" strokeWidth="2.5" fill="none" strokeLinejoin="round"/></svg>
    );

    /* ── DATA ── */
    const DATA = {
        fr: {
            name: "Samantha Asdrubal", role: "Business Analyst",
            about: "À propos", skills: "Compétences", projects: "Projets", contact: "Contact",
            start: "Démarrer", menu: ["Fichier","Edition","Affichage","Aide"],
            computer: "Poste de travail", recycle: "Corbeille",
            hint: "Double-cliquez sur une icône pour ouvrir",
            back: "← Retour",
            aboutTitle: "À propos de moi", skillsTitle: "Mes Compétences",
            projectsTitle: "Mes Projets", contactTitle: "Contact",
            aboutText1: "Bienvenue dans mon univers numérique ! Étudiante en Master Data & IA et alternante en tant que Business Analyst chez Mailinblack, une entreprise spécialisée en cybersécurité, je suis passionnée par la transformation des données en leviers de décision stratégiques.",
            aboutText2: "Au fil de mes expériences, j'ai développé une expertise en création et optimisation de processus, ainsi qu'en conception de dashboards de reporting et d'analyse permettant de piloter efficacement l'activité et de faciliter la prise de décision.",
            aboutText3: "Curieuse et orientée résultats, mon objectif est de transformer des données complexes en insights actionnables et de concevoir des visualisations claires, impactantes et utiles aux équipes métiers.",
            skillCats: [
                { title: "Data & Analyse",           list: ["Python","SQL","Excel / Google Sheets"] },
                { title: "Visualisation & Reporting", list: ["Tableau","Salesforce (dashboards & rapports)","Notion (espaces & automatisation)"] },
                { title: "Automatisation & Outils",  list: ["Make","N8N","Dust (création d'agents IA)","Intégration d'API","GitHub / VS Code"] }
            ],
            projects: [
                { title: "Workflow SEO Ranking (Hackathon)", desc: "Workflow N8N qui récupère une liste de mots-clés depuis Google Sheets et effectue un scoring basé sur le volume d'intentions de recherche de la veille.", tags: ["Make","N8N","Google Sheets","Hackathon"] },
                { title: "Prédiction Courses Hippiques",     desc: "Tableau de bord Google Sheets basé sur un dataset 2020. L'utilisateur indique les partants et reçoit une prédiction du top 3/5 via un scoring basé sur les performances passées.", tags: ["Google Sheets","Data Analysis","Dashboard"] },
                { title: "Scraping Films & Séries",         desc: "Scraping de JustWatch pour créer un site de recommandation de films et séries personnalisé selon les goûts de l'utilisateur.", tags: ["Python","Scraping","Web"] },
                { title: "Chatbot Paroles de Musique",       desc: "Scraping de LyricsTranslate pour créer un chatbot aidant les utilisateurs à retrouver le titre d'une chanson à partir de ses paroles.", tags: ["Python","Scraping","Chatbot"] },
                { title: "Hub Supply Marketplace (Mirakl)",  desc: "Plateforme créée lors d'un hackathon avec Mirakl, permettant aux vendeurs d'un marketplace de gérer leur supply chain depuis un hub centralisé.", tags: ["Hackathon","Mirakl","Supply Chain"] }
            ],
            contactText: "Envoyez-moi un message ! Vous avez un projet data en tête ? N'hésitez pas à me contacter.",
            sendMessage: "Envoyer un message"
        },
        en: {
            name: "Samantha Asdrubal", role: "Business Analyst",
            about: "About", skills: "Skills", projects: "Projects", contact: "Contact",
            start: "Start", menu: ["File","Edit","View","Help"],
            computer: "My Computer", recycle: "Recycle Bin",
            hint: "Double-click an icon to open",
            back: "← Back",
            aboutTitle: "About Me", skillsTitle: "My Skills",
            projectsTitle: "My Projects", contactTitle: "Contact",
            aboutText1: "Welcome to my digital universe! A Master's student in Data & AI and apprentice Business Analyst at Mailinblack, a cybersecurity company, I am passionate about transforming data into strategic decision levers.",

                { title: "Visualization & Reporting",list: ["Tableau","Salesforce (dashboards & reports)","Notion (spaces & automation)"] },
                { title: "Automation & Tools",       list: ["Make","N8N","Dust (AI agent creation)","API Integration","GitHub / VS Code"] }

    /* ── CONTENT COMPONENTS ── */
    function AboutContent({ T }) {
        return (
            <div className="w-pad">
                <div className="w-hero">
                    <div className="w-avatar">SA</div>
                    <div>
                        <div style={{fontWeight:'bold',fontSize:'14px',color:'#003087'}}>{T.name}</div>
                        <div style={{color:'#316AC5',fontSize:'11px'}}>{T.role}</div>
                    </div>
                </div>
                <div className="w-section">📋 {T.aboutTitle}</div>
                <p className="w-para">{T.aboutText1}</p>
                <p className="w-para">{T.aboutText2}</p>
                <p className="w-para">{T.aboutText3}</p>
            </div>
        );
    }

    function SkillsContent({ T }) {
        return (
            <div className="w-pad">
                <div className="w-section">⚙️ {T.skillsTitle}</div>
                <div className="skill-grid">
                    {T.skillCats.map((cat, i) => (
                        <div key={i} className="skill-cat">
                            <div className="skill-cat-ttl">📁 {cat.title}</div>
                            {cat.list.map((s, j) => (
                                <div key={j} className="skill-item">
                                    <span className="skill-arrow">▶</span> {s}
                                </div>
                            ))}
                        </div>
                    ))}
                </div>
            </div>
        );
    }

    function ProjectsContent({ T }) {
        const [selected, setSelected] = useState(null);
        return (
            <div className="w-pad">
                <div className="w-section">🗂️ {T.projectsTitle}</div>
                {selected !== null ? (
                    <div className="proj-detail">
                        <button className="proj-back" onClick={() => setSelected(null)}>{T.back}</button>
                        <div className="proj-card">
                            <div className="proj-title">{T.projects[selected].title}</div>
                            <div className="proj-desc">{T.projects[selected].desc}</div>
                            <div>{T.projects[selected].tags.map((t,i) => <span key={i} className="tag">{t}</span>)}</div>
                        </div>
                    </div>
                ) : (
                    <div className="proj-grid">
                        {T.projects.map((p, i) => (
                            <div key={i} className="proj-folder" onDoubleClick={() => setSelected(i)} onClick={() => setSelected(i)}>
                                <svg viewBox="0 0 48 40" width="42" height="35">
                                    <rect x="0" y="14" width="48" height="26" rx="3" fill="#E8A400"/>
                                    <rect x="0" y="10" width="22" height="6" rx="3" fill="#E8A400"/>
                                    <rect x="0" y="14" width="48" height="24" rx="3" fill="#F5C842"/>
                                    <rect x="1" y="18" width="46" height="19" rx="2" fill="#FADA6B"/>
                                    <rect x="0" y="14" width="48" height="5" fill="#E8A400" opacity="0.5"/>
                                </svg>
                                <span>{p.title}</span>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );
    }

    function ContactContent({ T }) {
        return (
            <div className="w-pad">
                <div className="w-section">✉️ {T.contactTitle}</div>
                <div className="contact-card">
                    <p style={{fontSize:'11px',color:'#333',marginBottom:'12px',lineHeight:'1.7'}}>{T.contactText}</p>
                    <a href="mailto:sasdrubal@eugeniaschool.com" className="contact-link">📧 sasdrubal@eugeniaschool.com</a>
                    <a href="https://github.com/samasdrr" target="_blank" rel="noopener noreferrer" className="contact-link">💻 github.com/samasdrr</a>
                    <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" className="contact-link">🔗 LinkedIn</a>
                </div>
                <a href="mailto:sasdrubal@eugeniaschool.com" className="send-btn">{T.sendMessage}</a>
            </div>
        );
    }

    /* ── MAIN COMPONENT ── */
    function Portfolio() {
        const [openWin, setOpenWin]   = useState(null);
        const [lang, setLang]         = useState("fr");
        const [active, setActive]     = useState(null);
        const [time, setTime]         = useState(new Date());

        useEffect(() => {
            const id = setInterval(() => setTime(new Date()), 30000);
            return () => clearInterval(id);
        }, []);

        const T = DATA[lang];

        const icons = [
            { id:'about',    label: T.about,    Svg: PersonSVG },
            { id:'skills',   label: T.skills,   Svg: DocSVG    },
            { id:'projects', label: T.projects, Svg: FolderSVG },
            { id:'contact',  label: T.contact,  Svg: MailSVG   },
        ];

        const TITLES = {
            about: T.aboutTitle, skills: T.skillsTitle,
            projects: T.projectsTitle, contact: T.contactTitle
        };

        const ICONS_EMO = { about:'👤', skills:'📊', projects:'📁', contact:'✉️' };

        const fmt = d => d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

        return (
            <div className="monitor-wrapper">
                {/* ── Monitor body ── */}
                <div className="monitor-body">
                    <div className="screen-bezel">
                        <div className="screen-inner">
                            <div className="xp-desktop" onClick={() => setActive(null)}>

                                {/* Clouds */}
                                <div className="cloud" style={{width:110,height:36,top:'5%',left:'22%'}}/>
                                <div className="cloud" style={{width:170,height:48,top:'2%',left:'46%'}}/>
                                <div className="cloud" style={{width:90, height:30,top:'9%',left:'72%'}}/>
                                <div className="cloud" style={{width:70, height:24,top:'14%',left:'12%',opacity:0.6}}/>

                                {/* Desktop icons */}
                                <div className="icons-col" onClick={e => e.stopPropagation()}>
                                    <div className={`d-icon ${active==='computer'?'active':''}`}
                                        onClick={e=>{e.stopPropagation();setActive('computer');}}>
                                        <ComputerSVG/><span className="d-lbl">{T.computer}</span>
                                    </div>
                                    {icons.map(ic => (
                                        <div key={ic.id}
                                            className={`d-icon ${active===ic.id?'active':''}`}
                                            onClick={e=>{e.stopPropagation();setActive(ic.id);}}
                                            onDoubleClick={e=>{e.stopPropagation();setOpenWin(ic.id);setActive(ic.id);}}>
                                            <ic.Svg/><span className="d-lbl">{ic.label}</span>
                                        </div>
                                    ))}
                                    <div className={`d-icon ${active==='recycle'?'active':''}`}
                                        onClick={e=>{e.stopPropagation();setActive('recycle');}}>
                                        <RecycleSVG/><span className="d-lbl">{T.recycle}</span>
                                    </div>
                                </div>

                                {/* Welcome text when no window open */}
                                {!openWin && (
                                    <div style={{position:'absolute',top:'42%',left:'50%',transform:'translate(-50%,-50%)',textAlign:'center',pointerEvents:'none'}}>
                                        <div style={{color:'#fff',fontSize:'20px',fontWeight:'bold',textShadow:'2px 2px 5px #000',marginBottom:'6px'}}>{T.name}</div>
                                        <div style={{color:'rgba(255,255,255,0.88)',fontSize:'13px',textShadow:'1px 1px 4px #000'}}>{T.role}</div>
                                        <div style={{color:'rgba(255,255,255,0.6)',fontSize:'10px',textShadow:'1px 1px 3px #000',marginTop:'8px'}}>{T.hint}</div>
                                    </div>
                                )}

                                {/* XP Window */}
                                {openWin && (
                                    <div className="xp-win" onClick={e=>e.stopPropagation()}>
                                        <div className="xp-titlebar">
                                            <div className="xp-title-text">
                                                <span>{ICONS_EMO[openWin]}</span>
                                                {TITLES[openWin]}
                                            </div>
                                            <div className="xp-win-btns">
                                                <div className="xp-btn xp-btn-min">_</div>
                                                <div className="xp-btn xp-btn-max">□</div>
                                                <div className="xp-btn xp-btn-cls" onClick={()=>setOpenWin(null)}>✕</div>
                                            </div>
                                        </div>
                                        <div className="xp-menubar">
                                            {T.menu.map(m=><span key={m} className="xp-mi">{m}</span>)}
                                        </div>
                                        <div className="xp-body">
                                            {openWin==='about'    && <AboutContent    T={T}/>}
                                            {openWin==='skills'   && <SkillsContent   T={T}/>}
                                            {openWin==='projects' && <ProjectsContent T={T}/>}
                                            {openWin==='contact'  && <ContactContent  T={T}/>}
                                        </div>
                                    </div>
                                )}

                                {/* Taskbar */}
                                <div className="xp-taskbar" onClick={e=>e.stopPropagation()}>
                                    <button className="start-btn">⊞ {T.start}</button>
                                    {openWin && (
                                        <div className="tb-item">
                                            {ICONS_EMO[openWin]} {TITLES[openWin]}
                                        </div>
                                    )}
                                    <div className="systray">
                                        <button className="lang-btn" onClick={()=>setLang(l=>l==='fr'?'en':'fr')}>
                                            {lang==='fr'?'🇬🇧 EN':'🇫🇷 FR'}
                                        </button>
                                        <span>|</span>
                                        <span>{fmt(time)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    {/* Monitor decorations */}
                    <div className="monitor-deco">
                        <div className="power-ring"/>
                        <div className="brand">EUGENIA</div>
                        <div className="led"/>
                    </div>
                </div>

                {/* Stand */}
                <div className="monitor-neck"/>
                <div className="monitor-base"/>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Portfolio/>);
</script>
</body>
</html>
